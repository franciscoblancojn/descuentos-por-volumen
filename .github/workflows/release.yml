# Publica una release al subir un tag X.Y.Z (npm run push-v -- patch|minor|major).
# El plugin la detecta (Update URI) y WordPress la instala desde Plugins → Actualizar.
name: release

on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*', 'v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar que el tag coincide con index.php
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(grep -m1 '^Version:' index.php | sed 's/Version:[[:space:]]*//' | tr -d '\r')"
          echo "tag=$TAG index.php=$VERSION"
          test "$TAG" = "$VERSION" || { echo "::error::El tag ($TAG) no coincide con Version de index.php ($VERSION)"; exit 1; }

      - name: Construir descuentos-por-volumen.zip (carpeta descuentos-por-volumen/ en la raíz)
        run: |
          mkdir -p /tmp/build/descuentos-por-volumen
          rsync -a --exclude '.git' --exclude '.github' --exclude '.gitignore' --exclude '/scripts' --exclude '/bin' \
            --exclude '/package.json' --exclude '/composer.json' --exclude '/AGENTS.md' ./ /tmp/build/descuentos-por-volumen/
          (cd /tmp/build && zip -rqX "$GITHUB_WORKSPACE/descuentos-por-volumen.zip" descuentos-por-volumen)

      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" descuentos-por-volumen.zip --title "$GITHUB_REF_NAME" --generate-notes
